<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2a1240">
<title>Cynthia</title>
<style>
  :root { --ink: #2a1f1d; --paper: #fbf7f2; --card: #ffffff; --line: #ebe2d6; --muted: #7a6b62; --accent: #b4232f; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #f5ede3; --paper: #13100e; --card: #1e1915; --line: #342b24; --muted: #b0a194; --accent: #e25563; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink);
    background:
      radial-gradient(120% 90% at 100% 0%, rgba(240, 167, 184, .35), transparent 60%),
      radial-gradient(100% 80% at 0% 100%, rgba(91, 42, 110, .3), transparent 60%),
      var(--paper);
  }
  main { width: min(440px, 100%); text-align: center; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-size: clamp(2.6rem, 12vw, 4rem); line-height: 1; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 28px; }
  a.card {
    display: flex; align-items: center; gap: 14px; text-align: left; text-decoration: none; color: inherit;
    padding: 18px 20px; border-radius: 18px; background: var(--card); border: 1px solid var(--line);
    box-shadow: 0 1px 2px rgba(42,31,29,.05), 0 8px 24px -6px rgba(42,31,29,.12); transition: transform .15s ease;
  }
  a.card:hover { transform: translateY(-2px); }
  .ico { font-size: 1.8rem; }
  b { display: block; font-size: 1.05rem; }
  small { color: var(--muted); }
  .go { margin-left: auto; font-size: 1.5rem; color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Cynthia</h1>
  <p>Welcome!</p>
  <a class="card" href="/wishlist/">
    <span class="ico" aria-hidden="true">🎁</span>
    <span><b>Wish list</b><small>What she's hoping for</small></span>
    <span class="go" aria-hidden="true">›</span>
  </a>
</main>
</body>
</html>
